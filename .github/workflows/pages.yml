name: Refresh data and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parsers and valuation engine
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          node --check site/app.mjs
      - name: Refresh public snapshots
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        run: python scripts/collect.py
      - name: Record refresh failure
        if: steps.refresh.outcome == 'failure'
        run: echo 'Data provider refresh failed. The website preserves the last valid snapshot and shows its original dates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh company forecasts
        if: github.event_name != 'push'
        id: forecasts
        continue-on-error: true
        run: python scripts/collect_forecasts.py
      - name: Record forecast refresh failure
        if: steps.forecasts.outcome == 'failure'
        run: echo 'Company forecast refresh failed. Original cached dates remain visible; stale forecasts are not automatically adopted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist dated snapshots
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh dated public market snapshots [skip ci]'
            git push origin HEAD:main
          fi
      - name: Validate static artifact
        run: python scripts/verify_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
